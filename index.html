<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Room Interface</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      #canvas-container {
        width: 100%;
        height: 100%;
      }

      canvas {
        display: block;
      }

      #camera-feed {
        position: fixed;
        right: 12px;
        bottom: 48px;
        width: 160px;
        height: 120px;
        object-fit: cover;
        border-radius: 8px;
        opacity: 0.9;
        z-index: 5;
        background: #111;
        transform: scaleX(-1);
        border: 1px solid rgba(0, 0, 0, 0.15);
      }

      .hint {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        color: #666;
        font-size: 0.85rem;
        letter-spacing: 0.04em;
        pointer-events: none;
        user-select: none;
        opacity: 0.7;
        max-width: min(90vw, 42rem);
        text-align: center;
      }

      .nav-tab {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 20;
        display: inline-flex;
        align-items: center;
        padding: 0.45rem 0.85rem;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 6px;
        color: #222;
        text-decoration: none;
        font-size: 0.82rem;
        letter-spacing: 0.02em;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .nav-tab:hover {
        background: #fff;
        border-color: rgba(0, 0, 0, 0.28);
      }
    </style>
  </head>
  <body>
    <a class="nav-tab" href="./data-viz.html">Data Visualization</a>
    <div id="canvas-container"></div>
    <video id="camera-feed" playsinline muted autoplay></video>
    <p class="hint">Loading…</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
